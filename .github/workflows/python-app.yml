name: Python application
#description: 'Check commits with linters, unit and e2e tests'

on:
  push:
    branches:
      - "**"
      - "!main"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        version: [1]

    steps:
      - name: Default directory
        id: set-current-directory
        run: |
          echo "CurrentDirectory=$(pwd)" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Upgrade pip and install requirements (dev)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-dev.txt

      - name: Install package in editable mode
        run: pip install -e .

      # If you need system dependencies, keep the following step
      # - name: Set up system packages
      #  uses: nill2/gha/install-packages@main

      - name: Lint with flake8 and pylint
        uses: nill2/gha/lint@main

      - name: Test unit tests with unittest
        env:
          IS_TEST: "GHA"
          MONGO_HOST: ${{ secrets.MONGO_HOST }}
          MONGO_PORT: ${{ secrets.MONGO_PORT }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          MONGO_COLLECTION: ${{ secrets.MONGO_COLLECTION }}
          FACE_COLLECTION: ${{ secrets.FACE_COLLECTION }}
          # AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          # AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
        run: |
          cd ${{ env.CurrentDirectory }}
          pytest -v --maxfail=1 --disable-warnings -q

      # Uncomment the following to enable E2E tests
      # - name: Test e2e tests with pytest
      #   env:
      #     IS_TEST: "GHA"
      #     MONGO_HOST: ${{ secrets.MONGO_HOST }}
      #     FTP_USER: ${{ secrets.FTP_USER }}
      #     FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      #     AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      #     AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      #   run: |
      #     pytest './tests/test_core.py'
